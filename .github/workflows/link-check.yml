name: link-check

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
  pull_request:
    paths:
      - '**/*.md'
  schedule:
    # Weekly, so rot is caught even without commits (Mondays 06:00 UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,206,429
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
